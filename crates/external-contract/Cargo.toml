[package]
name = "nauron-external-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "External contract DTOs for Nauron integrations"
repository = "https://github.com/nauron-ai/nauron-contracts"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
nauron-contracts = { path = "../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }

[features]
graphql = ["dep:async-graphql"]
sqlx = ["dep:sqlx"]

[dependencies.sqlx]
version = "0.9"
optional = true
default-features = false
features = ["postgres", "macros"]

[dependencies.async-graphql]
version = "7.2.1"
optional = true
default-features = false
