version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: chore

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
